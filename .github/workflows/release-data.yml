name: Release data package

# Cuts a versioned, atomic GitHub Release whenever data/manifest.json's content-hashed
# `version` field changes on `main` — the artifact a scheduled external puller should pull,
# instead of racing `main` mid-push.
#
# Two assets are published per release, from the same run and the same commit, so they are
# always the same manifest.version by construction:
#
#   data-package.tar.gz  embed/ + dist/ + the runtime data/*.json + assets/geo/ +
#                        assets/photos/ — everything a renderer needs at runtime.
#                        Deliberately excludes data/cache/, data/census/, data/nps/, and any
#                        other pipeline-only or geometry-source input that never ships to a
#                        reader. (dist/ is the minified build of embed/. CI checks the two
#                        stay in sync, but nothing forces a release to wait for CI, so the
#                        release rebuilds and verifies before it tars — see below.)
#   data-json.tar.gz     the runtime data/*.json only, same data/-prefixed paths, for a
#                        consumer that renders its own map and supplies its own images —
#                        photos and geometry are ~98% of the full package's bytes.
#
# RUNTIME_JSON below is the single source of truth for that file list: both tarballs are built
# from it, so the JSON-only asset cannot drift from the full one as derived files are added.

on:
  push:
    branches: [main]
    paths:
      - "data/manifest.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('data/manifest.json'))['version'])")
          SCHEMA=$(python3 -c "import json; print(json.load(open('data/manifest.json')).get('schema_version') or 'unversioned')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
          echo "tag=data-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.manifest.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: "22"
          cache: npm

      # The committed dist/ ships in the package, so it must match embed/ at THIS commit. CI
      # asserts that on PRs, but nothing gates this workflow on CI having passed (a data push or
      # a merge that ran ahead of its checks lands here regardless), so verify it again rather
      # than publish a minified widget that disagrees with its source.
      - name: Verify dist/ matches embed/
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::dist/ is stale at this commit; run 'npm run build', commit, and re-release."
            exit 1
          fi

      - name: Build release tarballs
        id: build
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          # Single source of truth for the runtime JSON payload — used by both tarballs.
          RUNTIME_JSON=(
            data/manifest.json
            data/courts.json
            data/judges
            data/circuit_justices.json
            data/judges_search.json
            data/seat_blocks.json
            data/district_arrangement.json
            data/district_arrangement_alt.json
            data/appointments.json
            data/president_photos.json
          )
          tar czf data-package.tar.gz embed dist "${RUNTIME_JSON[@]}" assets/geo assets/photos
          tar czf data-json.tar.gz "${RUNTIME_JSON[@]}"
          {
            echo "full_size=$(du -h data-package.tar.gz | cut -f1)"
            echo "json_size=$(du -h data-json.tar.gz | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.manifest.outputs.version }}"
          TAG="${{ steps.manifest.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          COUNTS=$(jq -r '.counts | "\(.courts) courts (\(.circuits) circuits, \(.districts) districts, \(.specialized) specialized), \(.judges) judges, \(.photo_thumbs) cached photos."' data/manifest.json)
          LAST_APPT=$(jq -r '.last_appointment // "n/a"' data/manifest.json)
          SCHEMA="${{ steps.manifest.outputs.schema }}"
          NOTES=$(printf 'Automated data-package release (manifest.version=%s, schema_version=%s), cut because `data/manifest.json` changed on `main`.\n\n%s\nLast tracked appointment: %s.\n\n## Assets\n\n| asset | size | contains |\n| --- | --- | --- |\n| `data-package.tar.gz` | %s | `embed/` (readable source) + `dist/` (minified production build) + the runtime `data/*.json` + `assets/geo/` + `assets/photos/` — everything a renderer needs, nothing the build pipeline does not ship. |\n| `data-json.tar.gz` | %s | the runtime `data/*.json` only, same `data/` paths — for a consumer that renders its own map and supplies its own images. |\n\nBoth are cut from this same commit, so they are always the same `manifest.version`. If you do not need an archive at all, pinning to the immutable tag `%s` and fetching files at that ref is equally atomic and cheaper still.\n\n`schema_version` is semver over the SHAPE of the data and moves only when the contract does; `manifest.version` above is a content hash and moves whenever the data does. Gate compatibility on the former, change detection on the latter -- see `docs/DATA_CONTRACT.md` (policy + stability tiers), `docs/SCHEMA_CHANGELOG.md` (shape history), `docs/CODEBOOK.md` (field reference), and `README.md` (how to sync).' \
            "$VERSION" "$SCHEMA" "$COUNTS" "$LAST_APPT" \
            "${{ steps.build.outputs.full_size }}" "${{ steps.build.outputs.json_size }}" "$TAG")
          gh release create "$TAG" data-package.tar.gz data-json.tar.gz \
            --title "Data $TAG" \
            --notes "$NOTES"
