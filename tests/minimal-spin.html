<!doctype html>
<meta charset="utf-8">
<title>minimal cc spin repro</title>
<style>
  body { margin: 0; }
  #box { width: 100%; height: 740px; position: relative; overflow: hidden; }
  svg { max-width: 100%; max-height: 100%; display: block; }
  path { fill: #cfd6df; stroke: #5c6775; stroke-width: 2; vector-effect: non-scaling-stroke; }
</style>
<div id="box"><svg id="s"></svg></div>
<script>
  // Mimic the widget's morph: a big-coordinate SVG whose viewBox AND element aspect-ratio
  // interpolate per frame between the real national and ca8-local frames.
  const params = new URLSearchParams(location.search);
  const scaleDiv = +params.get("div") || 1;   // divide all coordinates by this
  const A = [-2492274, -175515, 4966623, 3348083].map((v) => v / scaleDiv); // national
  const B = [-626531, -1083521, 1289545, 1816964].map((v) => v / scaleDiv); // ca8 local
  const svg = document.getElementById("s");
  // one simple path spanning the box (content volume irrelevant to the hypothesis)
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const [x, y, w, h] = A;
  p.setAttribute("d", `M ${x + w * 0.1} ${y + h * 0.1} L ${x + w * 0.9} ${y + h * 0.2} L ${x + w * 0.5} ${y + h * 0.9} Z`);
  svg.append(p);
  window.__rafN = 0;
  let dir = 1, u = 0;
  const t0 = performance.now();
  (function frame() {
    window.__rafN++;
    u += dir * 0.02;
    if (u >= 1 || u <= 0) dir = -dir;
    const vb = A.map((v, i) => v + (B[i] - v) * u);
    svg.setAttribute("viewBox", vb.join(" "));
    svg.style.aspectRatio = `${vb[2]} / ${vb[3]}`;
    if (performance.now() - t0 < 15000) requestAnimationFrame(frame);
    else document.title = "done-" + window.__rafN;
  })();
</script>
